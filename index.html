<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111116">
    <meta name="description" content="Aktivitäten mit zufälliger Intensität für euer Spiel.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Lucky Act – Das Partyspiel</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <a class="brand" href="#" aria-label="Lucky Act – Startseite" data-screen-link="home">
          <span class="brand-mark" aria-hidden="true">L</span>
          <span>Lucky <span class="brand-accent">Act</span></span>
        </a>
      </header>

      <main>
        <section class="screen home-screen" id="home-screen" aria-label="Spiel">
          <div class="home-card">
            <button class="button button-primary button-large" id="new-task-button" type="button">
              <span>Neue Aufgabe</span><span class="button-arrow" aria-hidden="true">↗</span>
            </button>
            <button class="people-mode" type="button" data-multi-person-toggle aria-pressed="false" aria-label="Mehrpersonen-Aufgaben">
              <span class="people-mode-copy">
                <span class="people-mode-title">Mehrpersonen-Aufgaben</span>
                <span class="people-mode-status">Aus – nur eine Person</span>
              </span>
              <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
            </button>
            <button class="people-mode repeat-mode" type="button" data-avoid-repeats-toggle aria-pressed="false" aria-label="Wiederholungen vermeiden">
              <span class="people-mode-copy">
                <span class="people-mode-title">Wiederholungen vermeiden</span>
                <span class="people-mode-status">Aus – Wiederholungen erlaubt</span>
              </span>
              <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
            </button>
            <p class="repeat-progress" data-repeat-progress aria-live="polite"></p>
            <button class="button button-secondary" id="manage-from-home" type="button">Aktivitäten</button>
            <p class="activity-count"><span class="count-dot" aria-hidden="true"></span><span id="home-activity-count">0 Aktivitäten</span></p>
          </div>
        </section>

        <section class="screen task-screen" id="task-screen" aria-labelledby="task-title" hidden>
          <button class="back-link" id="task-home-button" type="button">← Start</button>
          <div class="task-card">
            <h1 id="task-title">Aufgabe</h1>
            <div class="intensity-display" aria-label="Intensität">
              <span id="task-number" class="intensity-number">1</span>
              <span class="intensity-total">/10</span>
            </div>
            <div class="task-divider" aria-hidden="true"><span></span></div>
            <h2 id="task-activity" class="task-activity"></h2>
            <p id="task-people" class="task-people" hidden></p>
            <p id="task-description" class="task-description"></p>
            <p class="safe-play-note">Spielt sicher.</p>
            <button class="people-mode task-people-mode" type="button" data-multi-person-toggle aria-pressed="false" aria-label="Mehrpersonen-Aufgaben">
              <span class="people-mode-copy">
                <span class="people-mode-title">Mehrpersonen-Aufgaben</span>
                <span class="people-mode-status">Aus – nur eine Person</span>
              </span>
              <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
            </button>
            <button class="people-mode repeat-mode" type="button" data-avoid-repeats-toggle aria-pressed="false" aria-label="Wiederholungen vermeiden">
              <span class="people-mode-copy">
                <span class="people-mode-title">Wiederholungen vermeiden</span>
                <span class="people-mode-status">Aus – Wiederholungen erlaubt</span>
              </span>
              <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
            </button>
            <p class="repeat-progress" data-repeat-progress aria-live="polite"></p>
            <button class="button button-primary button-large" id="next-task-button" type="button">
              <span>Nächste Aufgabe</span><span class="button-arrow" aria-hidden="true">↗</span>
            </button>
            <button class="button button-quiet" id="task-home-secondary" type="button">Start</button>
          </div>
        </section>

        <section class="screen manage-screen" id="manage-screen" aria-labelledby="manage-title" hidden>
          <button class="back-link" id="manage-home-button" type="button">← Start</button>
          <div class="manage-heading">
            <h1 id="manage-title">Aktivitäten</h1>
          </div>

          <form class="add-form" id="activity-form">
            <label for="activity-input">Neue Aktivität</label>
            <div class="input-row">
              <input id="activity-input" name="activity" type="text" maxlength="120" autocomplete="off" placeholder="Aktivität eingeben">
            </div>
            <div class="input-options">
              <label for="person-count-input">Benötigte Personen</label>
              <select id="person-count-input" name="personCount">
                <option value="1">1 Person</option>
                <option value="2">2 Personen</option>
                <option value="3">3 Personen</option>
              </select>
              <button class="button button-primary add-button" type="submit">Hinzufügen</button>
            </div>
            <p class="input-hint">Max. 120 Zeichen. Keine doppelten Einträge.</p>
          </form>

          <div class="list-heading">
            <h2>Gespeicherte Aktivitäten</h2>
            <span class="count-badge" id="manage-activity-count">0</span>
          </div>
          <p class="empty-state" id="empty-state" hidden>Keine Aktivitäten vorhanden.</p>
          <ul class="activity-list" id="activity-list" aria-label="Gespeicherte Aktivitäten"></ul>
        </section>

        <p class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></p>
      </main>

      <footer class="site-footer">
        <button class="footer-button" id="rules-button" type="button">Regeln</button>
        <button class="footer-button" type="button">Impressum</button>
      </footer>
    </div>

    <dialog class="rules-dialog" id="rules-dialog" aria-label="Regeln">
      <p>Wenn es sich nach Schummeln anfühlt, ist es verboten.</p>
    </dialog>
  </body>
</html>
